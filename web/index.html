<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>好达考勤</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script></head><body><div class="shell"><main><section class="content"><div class="toolbar"><label><span>通报记录</span><select id="records" aria-label="选择通报日期"><option>正在读取</option></select></label><div class="toolbar-actions"><button id="refresh" class="refresh">刷新结果</button><span id="status" class="run-status">等待记录</span></div></div><div id="cards" class="cards"></div><section class="results"><div class="results-header"><div><h2>异常人员明细</h2><p id="date">每日名单将在这里显示</p></div><span id="total" class="total"></span></div><div id="result" aria-live="polite"><div class="empty"><h3>正在读取考勤结果</h3></div></div></section><div class="footnote"><span>请假、外出与出差按通报口径过滤；名单以机器人生成的结果为准。</span><span>时间均为北京时间</span></div><section class="notes"><div><h3>数据说明</h3><p>计划 9:01 单独读取最新考勤更新网页，9:30 群通报继续保留。定时任务可能延迟。实际取数时间显示在名单上方；网页发布需要几分钟。</p><p id="updated"></p></div><div><h3>历史范围</h3><p>展示最近 100 次运行，历史通报受源记录保留期限限制。运行完成不代表两个群均发送成功。</p></div></section><footer>HAODA <span>好达考勤看板</span></footer></section></main></div></body></html>
